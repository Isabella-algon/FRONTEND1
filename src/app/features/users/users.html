<h2>Usuarios</h2>

<table border="1" width="100%">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Email</th>
      <th>Identificación</th>
    </tr>
  </thead>

  <tbody>
    @for (u of usuarios(); track u.id) {
      <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.full_name }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.identification }}</td>
      </tr>
    }
  </tbody>
</table>
